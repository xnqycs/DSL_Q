name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    name: Check and build macOS ARM64
    runs-on: macos-15
    timeout-minutes: 30
    outputs:
      label: ${{ steps.version.outputs.label }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Resolve version
        id: version
        shell: bash
        run: |
          version="$(cat VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'VERSION must contain X.Y.Z.' >&2
            exit 1
          fi
          label="ci-${GITHUB_SHA:0:7}"
          prerelease=false
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            label="$GITHUB_REF_NAME"
            if [[ ! "$label" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ || "${label%%-*}" != "v$version" ]]; then
              echo 'Release tag must be vX.Y.Z (optionally -rc.1, etc.) and match VERSION.' >&2
              exit 1
            fi
            if [[ "$label" == *-* ]]; then prerelease=true; fi
          fi
          printf 'label=%s\nprerelease=%s\n' "$label" "$prerelease" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.3'
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Show build environment
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          swift --version
          go version
          node --version

      - name: Install extension dependencies
        run: npm ci --prefix extension --no-audit --no-fund

      - name: Run project checks
        run: ./scripts/check.sh

      - name: Build application
        env:
          DSLQ_BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/build.sh

      - name: Package application, extension and source
        env:
          PACKAGE_LABEL: ${{ steps.version.outputs.label }}
        run: ./scripts/package.sh "$PACKAGE_LABEL"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: DSL-Q-${{ steps.version.outputs.label }}-macos-arm64
          path: dist/packages/${{ steps.version.outputs.label }}/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified packages
        uses: actions/download-artifact@v8.0.2
        with:
          name: DSL-Q-${{ needs.build.outputs.label }}-macos-arm64
          path: packages

      - name: Verify package checksums
        working-directory: packages
        run: sha256sum --check SHA256SUMS

      - name: Create and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.label }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        shell: bash
        run: |
          # Do not replace assets of an already published release on a rerun.
          if gh release view "$RELEASE_TAG" --json isDraft > "$RUNNER_TEMP/release.json" 2>/dev/null; then
            if [[ "$(jq -r '.isDraft' "$RUNNER_TEMP/release.json")" != true ]]; then
              echo "Release $RELEASE_TAG is already published; leaving it unchanged."
              exit 0
            fi
          else
            cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          ## 使用说明

          - 适用于 Apple Silicon Mac，macOS 14 或更新版本。
          - 下载 `macos-arm64.zip`，解压后将 `DSL Q.app` 放入“应用程序”。
          - 应用仅作 ad-hoc 签名，未经过 Apple Developer ID 签名或公证；首次打开可能被 macOS 安全机制拦截。
          - Chrome 扩展可在应用设置中安装连接组件并导出，也提供独立扩展压缩包。
          - `source.tar.gz` 为该版本源码，`SHA256SUMS` 用于校验附件完整性。

          NOTES
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "DSL Q $RELEASE_TAG" --generate-notes \
              --notes-file "$RUNNER_TEMP/release-notes.md" --prerelease="$PRERELEASE"
          fi
          gh release upload "$RELEASE_TAG" packages/*.zip packages/*.tar.gz packages/SHA256SUMS --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$PRERELEASE"
